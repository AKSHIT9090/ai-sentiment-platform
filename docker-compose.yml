services:
  postgres:
    image: postgres:17
    container_name: sentiment-postgres
    environment:
      POSTGRES_DB: sentiment_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentiment_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build:
      context: ./ml-service
    container_name: sentiment-ml-compose
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: sentiment-backend-compose
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: sentiment_platform
      DB_PASSWORD: postgres
      DB_PORT: 5432
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: sentiment-frontend-compose
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: